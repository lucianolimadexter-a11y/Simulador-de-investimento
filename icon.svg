<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0A0B0D"/>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bgGrad)" opacity="0.4"/>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0" stop-color="#15181D"/>
      <stop offset="1" stop-color="#0A0B0D"/>
    </linearGradient>
  </defs>

  <!-- candlesticks -->
  <g>
    <rect x="118" y="290" width="34" height="110" rx="4" fill="#7A7F87"/>
    <line x1="135" y1="260" x2="135" y2="430" stroke="#7A7F87" stroke-width="6" stroke-linecap="round"/>

    <rect x="192" y="330" width="34" height="70" rx="4" fill="#FF5470"/>
    <line x1="209" y1="305" x2="209" y2="415" stroke="#FF5470" stroke-width="6" stroke-linecap="round"/>

    <rect x="266" y="220" width="34" height="150" rx="4" fill="#3DDC84"/>
    <line x1="283" y1="185" x2="283" y2="390" stroke="#3DDC84" stroke-width="6" stroke-linecap="round"/>

    <rect x="340" y="150" width="34" height="120" rx="4" fill="#3DDC84"/>
    <line x1="357" y1="115" x2="357" y2="290" stroke="#3DDC84" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- trend line -->
  <polyline points="110,400 190,360 264,240 356,140 400,100"
    fill="none" stroke="#E8A33D" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="100" r="16" fill="#E8A33D"/>
</svg>
